; UE IoStore plugin (uetoc.wcx64) options. See SPEC.md §9.
[Options]
OpenUtocAsVirtualFile=1     ; 1: opening a .utoc shows <ContainerId>.txt; 0: open it like the .ucas
GlobalParentLookupLimit=5   ; parent folders searched for global.utoc (never above the Paks folder)
MountPoint=Folder           ; Folder: mount point shown as folders; Root: contents of the mount point
MountFolderAttr=Hidden      ; attribute of the mount folders (Hidden, ReadOnly, System, None)
VirtualFolderAttr=Hidden    ; attribute of the $chunks and $legacy folders
LegacyEngineVersion=Auto    ; $legacy: engine version for unversioned packages (Auto, UE4_27, UE5_0 ... UE5_8)
LegacyGuessScriptTypes=0    ; $legacy: 1 = guess ScriptStruct/Enum for engine struct/enum imports by name instead of Object (better for viewers; a wrong guess breaks that import when the engine loads the file)
DebugLog=0                  ; 1: write uetoc.log (or keep it in memory and copy it on errors)

[Pack]
; Packing raw Zen files (SPEC §6b): files must already exist in the game (any container under
; the global's folder); their chunk ID, path and store entry are reused.
PackMode=ReplaceOnly        ; ReplaceOnly; ReplaceWithAddition comes later (packs as ReplaceOnly for now)
Compression=Match           ; Match (the container's own method; new containers: the game's), None, Zlib, Gzip, LZ4, Oodle
ZlibLevel=6                 ; 0-9 (Zlib and Gzip)
OodleCompressor=Kraken      ; Kraken, Mermaid, Selkie, Leviathan
OodleLevel=Normal           ; SuperFast, VeryFast, Fast, Normal, Optimal1 ... Optimal5
WriteEmptyPak=1             ; new container: also write an empty <name>.pak (the game mounts IoStore through it)
WarnPakNeeded=1             ; WriteEmptyPak=0: warn that a .pak is needed
Compact=0                   ; 1: rebuild after every change (drops replaced data)
AutoCompactUnder=10M        ; rebuild containers smaller than this after a change (0: never)
NewMountPoint=Auto          ; new container: Auto (UE: common folder of the files) or e.g. ../../../Game/Content/
ValidateOnReplace=Warn      ; replaced game packages that can break loading (imports, exports, name): Warn (ask), Fix (correct imports, then list), Error (refuse), Off
