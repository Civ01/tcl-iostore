[package]
name = "tcl-iostore"
version = "0.1.0"
edition = "2021"
description = "Total Commander packer plugin (WCX) for Unreal Engine IoStore containers (.utoc/.ucas)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "uetoc"
# cdylib only: adding "rlib" silently disables LTO and ~triples the DLL size.
crate-type = ["cdylib"]

[dependencies]
iostore = { git = "https://github.com/Civ01/retoc", branch = "tcl-iostore" }
# legacy view (SPEC §6a): retoc's to-legacy conversion
retoc = { git = "https://github.com/Civ01/retoc", branch = "tcl-iostore" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
# panic must stay "unwind": every export catches panics so TC never crashes.
